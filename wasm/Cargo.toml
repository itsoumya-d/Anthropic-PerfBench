[package]
name = "perfbench-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly SIMD INT4 GEMV target for Anthropic-PerfBench"

[lib]
name = "perfbench_wasm"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
