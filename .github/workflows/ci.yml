name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  arm64:
    name: NEON kernels (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Benchmark and roofline
        run: |
          make bench
          python3 scripts/roofline.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: arm64-results
          path: results/

  scalar:
    name: Scalar fallback (Ubuntu x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test

  wasm:
    name: WASM SIMD INT4 GEMV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rust tests
        run: cargo test --manifest-path wasm/Cargo.toml
      - name: Build wasm32 module
        run: cargo build --release --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: Cross-language parity
        run: node wasm/parity.mjs
      - name: Quick benchmark
        run: node wasm/bench.mjs --quick
