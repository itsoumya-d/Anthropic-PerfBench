name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  arm64:
    name: NEON kernels (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Benchmark and roofline
        run: |
          make bench
          python3 scripts/roofline.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: arm64-results
          path: results/

  scalar:
    name: Scalar fallback (Ubuntu x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
